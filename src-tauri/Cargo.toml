[package]
name = "goc-solver"
version = "1.1.0"
description = "GOC Rune Solver"
authors = ["pot-app"]
license = "GPL-3.0-only"
edition = "2021"

# 本地 vendor 修改版：图标路径不再 canonicalize，修复 llvm-rc 无法解析 \\?\ 长路径的问题
[patch.crates-io]
tauri-winres = { path = "vendor/tauri-winres" }
# 本地 vendor 修改版：aarch64 资源编译 target 改用 llvm-windres 支持的 triple 形式
embed-resource = { path = "vendor/embed-resource" }
# 本地 vendor 修改版：GNU 工具链也静态链接 WebView2Loader，exe 单文件分发无需携带 DLL
webview2-com-sys = { path = "vendor/webview2-com-sys" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]

tauri = { version = "1.8", features = [ "dialog-open", "fs-all", "protocol-asset", "shell-all", "clipboard-write-text", "notification-all", "global-shortcut-all", "window-all", "path-all", "os-all", "system-tray"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-fs-watch = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0.1"
once_cell = "1.19.0"
mouse_position = "0.1.4"
log = "0.4"
tiny_http = "0.12.0"
screenshots = "=0.7.2"
base64 = "0.22"
thiserror = "1.0"
font-kit = "0.14.2"
# font-kit 栅格化 API 需要 Transform2F/Vector2I 类型（font-kit 不再导出）
pathfinder_geometry = "0.5.1"
image = "0.25.4"

[target.'cfg(windows)'.dependencies]
# Win32：截图/结果窗口置顶与 NOACTIVATE、重启时轮询旧进程句柄（Threading）；WinRT：Windows.Media.Ocr 自动解题管线
windows = {version="0.58.0",features= ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
window-shadows = "0.2"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# 封存的全屏实现（v1.4.0 弃用）：手动框选降级路径（符文「OCR 框选」/ 波形「框选」
# 画布）等绕过全局裁切模式的全屏识别入口。默认不编入构建，代码保留在原处以备恢复：
# cargo build --features legacy-fullscreen
legacy-fullscreen = []
