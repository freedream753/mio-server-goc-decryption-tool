<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>符文解密实验室</title>
<style>
/* ============ 做题区 = 游戏「当前猜测」盘面复刻 ============
   布局与配色对齐游戏截图：深蓝面板 + 「当前猜测」4 个细边彩框（绿/黄/红=反馈）
   + 6 个青色实心符文键 + 提交解密 + 剩余次数 + 破解失败提示。
   识别器（v1.1.0，src-tauri/src/runes.rs）对盘面的要求：
   1) 恰好 4 个近正方形空心环：尺寸/节距互差 ≤4/3、宽高比 0.65~1.55、框宽/节距 ∈[0.25,0.75]、
      同一中心行；边框（带内 80 分位亮度）须比框内中央 50% 中位亮度高 ≥20；
   2) 反馈色只取已定位方框的边框环：色相 红<30°|≥330°、黄 30~95°、绿 95~205°、彩度 ≥18；
   3) 色相掩膜驱动行/列投影定位 —— 除这 4 个彩框外不要出现其它高饱和色块；
      游戏里的青色符文键是实心块，靠「边框须比内部亮」被剔除，这里同样用实心块。 */
:root{
  --panel:#0a2140; --panel-line:#17456f; --panel-deep:#071a33;
  --cyan:#23c8e8; --cyan-ink:#06263f;
  --green:#3ec06a; --yellow:#e0c341; --red:#e2565f;
  --ink:#dbe7f5; --muted:#8fa8c4;
  font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
}
*{box-sizing:border-box}
body{margin:0;background:var(--panel-deep)}
.layout{display:grid;grid-template-columns:minmax(0,760px) minmax(320px,1fr);gap:24px;max-width:1280px;margin:0 auto;padding:28px 24px 40px;align-items:start}

/* ---- 游戏盘面 ---- */
.terminal{background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;padding:0 0 26px}
.term-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #123a5f}
.term-mark{width:26px;height:26px;border-radius:50%;border:2px solid #3d6f9e;display:grid;place-items:center;font-size:12px;color:#7fb3dd}
.term-name{font-weight:700;letter-spacing:1px;color:#cfe4f7}
.term-sub{font-size:10px;letter-spacing:2px;color:#5f88ad}
.term-badge{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--cyan);font-size:12px}
.term-stage{margin:16px 18px 0;display:inline-block;padding:6px 12px;background:#0d3a5c;color:var(--cyan);font-size:13px;font-weight:700;letter-spacing:1px}
.term-goal{margin:10px 18px 0;font-size:13px;color:#b9cfe4}
.stage{margin:14px 18px 0;border:1px solid #1c4d7c;border-radius:4px;padding:16px 18px 22px;text-align:center}
.stage-tip{font-size:12px;color:#9db8d3;border-bottom:1px solid #1c4d7c;padding-bottom:10px}
.stage-title{margin:16px 0 18px;font-size:15px;font-weight:700;letter-spacing:2px;color:#dceaf7}

/* 4 个反馈框：64px 近正方形、3px 细边、框宽/节距 ≈0.59 */
.slots{display:flex;gap:44px;justify-content:center;margin:0 0 26px}
.slot{width:64px;height:64px;padding:0;border:3px solid #c4c9d2;border-radius:2px;background:var(--panel);
  color:#fff;font-family:"Microsoft YaHei","Segoe UI",sans-serif;font-size:30px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
.slot .glyph{width:24px;height:24px;image-rendering:auto}
.palette .glyph{width:26px;height:26px}
.slot:hover{background:#123253}
.slot.empty{color:#3f648a}
.slot.c-green{border-color:var(--green)}
.slot.c-yellow{border-color:var(--yellow)}
.slot.c-red{border-color:var(--red)}
/* 当前选中位只改背景，绝不动边框：蓝框 hue≈213 不在任何反馈色带内，会让「恰好 4 个彩框」凑不齐 */
.slot.active{background:#123253;box-shadow:inset 0 0 0 1px #2f6a9c}

/* 6 个符文键：实心青块（实心 = 被「边框须比内部亮」整条剔除，不会凑成伪框） */
.palette{display:flex;gap:20px;justify-content:center;margin:0 0 24px}
.palette button{width:56px;height:56px;padding:0;border:0;border-radius:3px;background:var(--cyan);color:var(--cyan-ink);
  font-family:"Microsoft YaHei","Segoe UI",sans-serif;font-size:26px;font-weight:700;cursor:pointer}
.palette button:hover{background:#3ad2ef}
.palette button:disabled{opacity:.5;cursor:default}
.submit{width:220px;height:54px;border:0;border-radius:3px;background:var(--cyan);color:var(--cyan-ink);
  font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer}
.submit:hover{background:#3ad2ef}
.submit:disabled{opacity:.5;cursor:default}
.stage-left{margin-top:16px;font-size:13px;color:#c7dbee}
.stage-msg{margin-top:10px;font-size:15px;font-weight:700;color:#ff6a52;min-height:20px}
.stage-msg.ok{color:#5fe08a}

/* ---- 右侧实验面板 ---- */
aside{display:flex;flex-direction:column;gap:16px}
.card{background:#0b2440;border:1px solid #17456f;border-radius:8px;padding:18px}
.card h2{margin:0 0 12px;font-size:14px;letter-spacing:1px;color:#cfe4f7}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
select,input{width:100%;padding:9px 10px;background:#061a30;border:1px solid #1d4a78;border-radius:5px;color:var(--ink);font-size:13px}
button.ghost{background:#123253;border:1px solid #1d4a78;color:#cfe4f7;border-radius:5px;padding:8px 12px;font-size:13px;cursor:pointer}
button.ghost:hover{background:#173f68}
button.ghost:disabled{opacity:.45;cursor:default}
.help{font-size:12px;line-height:1.7;color:var(--muted)}
/* 历史记录用中性底 + 彩色字形：实心高饱和块会污染色相掩膜的行带 */
#history{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rec{display:flex;align-items:center;gap:6px;font-size:13px;color:#c7dbee}
.rec .no{color:#5f88ad;font-size:11px;width:18px}
.chip{width:34px;height:30px;display:grid;place-items:center;border-radius:3px;background:#0e2f4f;font-weight:700}
.chip.g{color:var(--green);border:1px solid #1f5c3c}
.chip.y{color:var(--yellow);border:1px solid #5c5320}
.chip.r{color:var(--red);border:1px solid #5c2b2b}
.answer{display:flex;align-items:center;gap:8px;font-size:13px;color:#c7dbee}
.answer b{letter-spacing:6px;color:var(--cyan)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.metric{background:#0e2f4f;border-radius:5px;padding:8px 2px;text-align:center}
.metric b{display:block;font-size:18px;color:var(--cyan)}
.metric span{font-size:10px;color:var(--muted)}
progress{width:100%;height:6px;accent-color:var(--cyan);margin-top:8px}
#testResult{font-size:12px;line-height:1.7;color:var(--muted);margin-top:8px}

/* ---- 识别视图：只留盘面，铺深色底，便于软件截图识别 ---- */
#recToggle{position:fixed;right:12px;top:12px;z-index:9;background:#0e2f4f;color:#cfe4f7;
  border:1px solid #1d4a78;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer}
body.rec-view{background:#04101f}
body.rec-view .layout{grid-template-columns:1fr;max-width:820px;padding-top:10vh}
body.rec-view aside{display:none}
</style></head><body>
<button id="recToggle">切换：实验面板</button>
<div class="layout">
  <main>
    <div class="terminal">
      <div class="term-head"><span class="term-mark">✦</span>
        <div><div class="term-name">GOC 奇术终端</div><div class="term-sub">THAUMATURGY TERMINAL · SECURE CHANNEL</div></div>
        <div class="term-badge"><span>1 / 3</span><span>✕</span></div>
      </div>
      <div class="term-stage">第 <span id="stageNo">1</span> 关 / 4 · 密码破解</div>
      <p class="term-goal">破解 4 位符文密码，按反馈推理出正确组合</p>
      <div class="stage">
        <div class="stage-tip">破解 4 位符文密码 提交后告知「位置对 / 错位」</div>
        <div class="stage-title">当前猜测</div>
        <div class="slots" id="slots"></div>
        <div class="palette" id="palette"></div>
        <button class="submit" id="submit">提交解密</button>
        <div class="stage-left">剩余 <span id="left">4</span> 次</div>
        <div class="stage-msg" id="msg"></div>
      </div>
    </div>
  </main>
  <aside>
    <div class="card">
      <h2>实验设置</h2>
      <div class="row"><select id="mode">
        <option value="count">按数量匹配（游戏实测规则）</option>
        <option value="presence">存在即黄（不扣数量）</option>
      </select></div>
      <div class="help" id="rule"></div>
      <div class="row" style="margin-top:12px"><button class="ghost" id="random" style="width:100%">↻ 随机新开一局</button></div>
      <div class="row" style="margin-top:6px"><input id="custom" maxlength="4" placeholder="指定测试答案，例如：风风土雷" autocomplete="off"><button class="ghost" id="set">应用</button></div>
      <div class="answer" style="margin-top:10px"><span>本局答案 <b id="answer">••••</b></span><button class="ghost" id="reveal">显示</button></div>
    </div>
    <div class="card">
      <h2>推理记录</h2>
      <div id="history"></div>
      <div id="statusLine" class="help"></div>
      <div class="row" style="margin-top:12px"><button class="ghost" id="hint">填入算法推荐</button><button class="ghost" id="auto">自动解完本局</button></div>
    </div>
    <div class="card">
      <h2>全量验证</h2>
      <div class="help">对当前规则的每个答案跑同一套策略，统计实际提交次数；不消耗本局机会。</div>
      <div class="row" style="margin-top:10px"><button class="ghost" id="verify" style="width:100%">验证全部 1296 个答案</button></div>
      <progress id="progress" max="1296" value="0"></progress>
      <div id="testResult">尚未运行验证</div>
      <div id="metrics" class="metrics"></div>
    </div>
  </aside>
</div>

<script id="core" type="text/plain">const symbols = '空火水风土雷';
const codes = Array.from({length:1296},(_,n)=>[Math.floor(n/216),Math.floor(n/36)%6,Math.floor(n/6)%6,n%6]);
function feedback(g,s,mode){
  let colors=[0,0,0,0], remaining=[0,0,0,0,0,0];
  for(let i=0;i<4;i++) if(g[i]!==s[i]) remaining[s[i]]++;
  for(let i=0;i<4;i++){
    if(g[i]===s[i]) colors[i]=2;
    else if(mode==='presence' && s.includes(g[i])) colors[i]=1;
    else if(mode==='count' && remaining[g[i]]){colors[i]=1;remaining[g[i]]--;}
  }
  return colors.reduce((n,c,i)=>n+c*3**i,0);
}
function createSolver(mode){
  const matrix=codes.map(g=>Uint8Array.from(codes,s=>feedback(g,s,mode))), cache=new Map();
  function choose(cs,turns){
    if(!cs.length||turns<1)return null;
    if(cs.length===1)return cs[0];
    if(turns===1)return null;
    const key=turns+':'+cs.join(',');if(cache.has(key))return cache.get(key);
    const options=[],set=new Set(cs),guesses=cs.length===1296?[51]:codes.keys();
    for(const gi of guesses){
      const buckets=new Map();
      for(const si of cs){const r=matrix[gi][si];if(r===80)continue;if(!buckets.has(r))buckets.set(r,[]);buckets.get(r).push(si);}
      const groups=[...buckets.values()],largest=Math.max(0,...groups.map(b=>b.length));
      if(largest===cs.length || (turns===2&&largest>1))continue;
      options.push({gi,groups,score:[largest,groups.reduce((n,b)=>n+b.length*b.length,0),set.has(gi)?0:1]});
    }
    options.sort((a,b)=>a.score[0]-b.score[0]||a.score[1]-b.score[1]||a.score[2]-b.score[2]||a.gi-b.gi);
    for(const o of options)if(o.groups.sort((a,b)=>b.length-a.length).every(b=>choose(b,turns-1)!==null)){cache.set(key,o.gi);return o.gi;}
    cache.set(key,null);return null;
  }
  return {matrix,choose};
}
</script><script id="workerCode" type="text/plain">const solvers={};
onmessage=({data})=>{
 try{
  const {id,type,mode,history}=data;
  const solver=solvers[mode]||(solvers[mode]=createSolver(mode));
  if(type==='recommend'){
    let cs=codes.map((_,i)=>i);
    for(const h of history)cs=cs.filter(si=>solver.matrix[h.guess][si]===h.result);
    postMessage({id,count:cs.length,guess:solver.choose(cs,4-history.length)});
  }else if(type==='verify'){
    const hist=[0,0,0,0], failures=[];
    for(let si=0;si<codes.length;si++){
      let cs=codes.map((_,i)=>i),won=false;
      for(let turn=1;turn<=4;turn++){
        const gi=solver.choose(cs,5-turn);if(gi===null)break;
        const r=solver.matrix[gi][si];
        if(r===80){hist[turn-1]++;won=true;break;}
        cs=cs.filter(s=>solver.matrix[gi][s]===r);
      }
      if(!won)failures.push(si);
      if(si%48===0)postMessage({id,progress:si+1});
    }
    postMessage({id,hist,failures});
  }
 }catch(e){postMessage({id:data.id,error:String(e)});}
};
</script>

const workerURL=URL.createObjectURL(new Blob([$('core').textContent+'\n'+$('workerCode').textContent],{type:'text/javascript'}));
const worker=new Worker(workerURL), pending=new Map();
let serial=0, busy=false, testing=false;
worker.onmessage=({data})=>{const p=pending.get(data.id);if(!p)return;if(data.progress){p.progress?.(data.progress);return;}pending.delete(data.id);data.error?p.reject(new Error(data.error)):p.resolve(data);};
worker.onerror=()=>{for(const p of pending.values())p.reject(new Error('计算线程启动失败，请用现代浏览器打开。'));pending.clear();};
function request(type,extra={}){return new Promise((resolve,reject)=>{const id=++serial;pending.set(id,{resolve,reject,progress:extra.progress});const {progress,...payload}=extra;worker.postMessage({id,type,mode:$('mode').value,history,...payload});});}

/* 本局状态：guess 为「当前猜测」盘面，colors 为该次提交的逐位反馈（0红 1黄 2绿） */
let secret=[], guess=[null,null,null,null], active=0, history=[], ended=false, revealed=false, colors=[null,null,null,null];
function rand(){const a=new Uint32Array(1);do{crypto.getRandomValues(a);}while(a[0]>=4294967292);return a[0]%6;}
function decode(n){return [Math.floor(n/216),Math.floor(n/36)%6,Math.floor(n/6)%6,n%6];}
function encode(a){return a.reduce((n,v)=>n*6+v,0);}
function judge(g,s){
  let c=[0,0,0,0], left=[0,0,0,0,0,0], mode=$('mode').value;
  for(let i=0;i<4;i++) if(g[i]!==s[i]) left[s[i]]++;
  for(let i=0;i<4;i++){
    if(g[i]===s[i]) c[i]=2;
    else if(mode==='presence' && s.includes(g[i])) c[i]=1;
    else if(mode==='count' && left[g[i]]){c[i]=1;left[g[i]]--;}
  }
  return c;
}
const COLOR_CLASS=['c-red','c-yellow','c-green'];
const COLOR_NAME=['红','黄','绿'];

function render(){
  $('slots').replaceChildren(...guess.map((v,i)=>{
    const b=document.createElement('button');
    b.className='slot'+(active===i?' active':'')+(v===null?' empty':'')+(colors[i]!==null?' '+COLOR_CLASS[colors[i]]:'');
    if(v===null){b.textContent='·';}
    else{const gi=document.createElement('img');gi.className='glyph';gi.src=GLYPH[names[v]];gi.alt=names[v];b.append(gi);}
    b.disabled=busy||ended||testing;
    b.title=v===null?'未选择':names[v]+(colors[i]!==null?' · '+COLOR_NAME[colors[i]]:'');
    b.onclick=()=>{active=i;render();};
    return b;
  }));
  $('palette').replaceChildren(...[...names].map((ch,i)=>{
    const b=document.createElement('button');
    const gi=document.createElement('img');gi.className='glyph key';gi.src=GLYPH[ch];gi.alt=ch;b.append(gi);
    b.disabled=busy||ended||testing;
    b.onclick=()=>{guess[active]=i;active=(active+1)%4;colors=[null,null,null,null];render();};
    return b;
  }));
  $('submit').disabled=busy||ended||testing||guess.includes(null);
  $('left').textContent=Math.max(0,4-history.length);
  $('stageNo').textContent=history.length+1;
  $('history').replaceChildren(...history.map((h,i)=>{
    const row=document.createElement('div');row.className='rec';
    const no=document.createElement('span');no.className='no';no.textContent=String(i+1).padStart(2,'0');row.append(no);
    decode(h.guess).forEach((v,j)=>{
      const c=Math.floor(h.result/3**j)%3, chip=document.createElement('span');
      chip.className='chip '+['r','y','g'][c]; chip.textContent=names[v]; chip.title=COLOR_NAME[c]; row.append(chip);
    });
    if(h.result===80){const t=document.createElement('span');t.className='help';t.textContent='解密成功';row.append(t);}
    return row;
  }));
  $('answer').textContent=revealed?secret.map(v=>names[v]).join(''):'••••';
  $('reveal').textContent=revealed?'隐藏':'显示';
  for(const id of ['random','set','mode','custom','reveal','hint','auto']) $(id).disabled=busy||testing;
  $('verify').disabled=busy||testing;
  $('rule').textContent=$('mode').value==='count'
    ? '先匹配绿色，再从左到右按剩余数量匹配黄色；红色可能表示该符号数量已用完。'
    : '黄色表示答案中存在该符号，不限制黄色数量；红色表示答案不含该符号。';
}

function message(text, ok){
  const m=$('msg'); m.textContent=text||''; m.classList.toggle('ok', !!ok);
  $('statusLine').textContent=text||'';
}
function newGame(answer){
  secret=answer||Array.from({length:4},rand);
  history=[]; guess=[null,null,null,null]; colors=[null,null,null,null];
  active=0; ended=false; revealed=false;
  render();
  message('', false);
  $('statusLine').textContent='首猜建议：空 · 火 · 水 · 风';
}
function submit(){
  if(ended||busy||guess.includes(null))return;
  const res=judge(guess,secret);
  history.push({guess:encode(guess),result:res.reduce((n,c,i)=>n+c*3**i,0)});
  colors=[...res];
  if(res.every(c=>c===2)){ended=true;message('解密成功！',true);}
  else if(history.length===4){ended=true;revealed=true;message('四次机会已用完。',false);}
  else message('破解失败，请重试',false);
  active=0; render();
}
async function assist(auto){
  busy=true; render();
  try{
    do{
      const r=await request('recommend');
      if(r.guess===null){message(`剩余 ${r.count} 个候选，无法保证在 ${4-history.length} 次内完成。`,false);break;}
      guess=decode(r.guess); colors=[null,null,null,null];
      message(`剩余 ${r.count} 个候选 · 推荐 ${guess.map(v=>names[v]).join(' · ')}`,true);
      render();
      if(auto){await new Promise(r=>setTimeout(r,320));submit();}
    }while(auto&&!ended);
  }catch(e){message(e.message,false);}
  finally{busy=false;render();}
}
$('submit').onclick=submit;
$('random').onclick=()=>newGame();
$('mode').onchange=()=>{newGame();$('testResult').textContent='规则已切换，请重新运行验证';$('metrics').replaceChildren();$('progress').value=0;};
$('set').onclick=()=>{
  const a=[...($('custom').value.trim())];
  if(a.length!==4||a.some(x=>!names.includes(x))){message('测试答案须为四个符文：空 火 水 风 土 雷',false);return;}
  newGame(a.map(x=>names.indexOf(x)));
};
$('reveal').onclick=()=>{revealed=!revealed;render();};
$('hint').onclick=()=>assist(false);
$('auto').onclick=()=>assist(true);
$('verify').onclick=async()=>{
  busy=true; testing=true; render(); $('progress').value=0; $('metrics').replaceChildren();
  $('testResult').textContent='正在逐个验证全部答案…';
  try{
    const r=await request('verify',{progress:n=>$('progress').value=n});
    $('progress').value=1296;
    $('testResult').textContent=r.failures.length
      ? `验证未通过：${r.failures.length} 个答案未在四次内解出。`
      : '验证通过：1296 / 1296 个答案均在四次内解出。';
    $('metrics').replaceChildren(...r.hist.map((n,i)=>{
      const d=document.createElement('div');d.className='metric';
      const b=document.createElement('b');b.textContent=n;
      const s=document.createElement('span');s.textContent=`${i+1} 次提交`;
      d.append(b,s);return d;
    }));
  }catch(e){$('testResult').textContent=e.message;}
  finally{busy=false;testing=false;render();}
};
/* 识别视图开关：隐藏右侧面板，只留游戏盘面，供软件截图识别 */
$('recToggle').onclick=()=>{
  document.body.classList.toggle('rec-view');
  $('recToggle').textContent=document.body.classList.contains('rec-view')?'切换：实验面板':'切换：识别视图';
};
document.body.classList.add('rec-view');
$('recToggle').textContent='切换：实验面板';
newGame();
</script></body></html>
